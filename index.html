
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFF9F3">
  <title>OOXX！挑戰電腦</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="app">

    <header class="header">
      <h1>OOXX <span>!</span></h1>
      <p>今天來挑戰電腦吧 ♡</p>
    </header>

    <!-- 首頁：選擇難度 -->
    <section id="home-screen" class="screen">
      <div class="card">
        <h2>🤖 選擇 AI 難度</h2>
        <p>準備好挑戰電腦了嗎？</p>

        <div class="difficulty-options">
          <button class="difficulty-btn"
                  data-level="easy">
            🌱 簡單
            <small>電腦隨機下棋</small>
          </button>

          <button class="difficulty-btn selected"
                  data-level="normal">
            ⭐ 普通
            <small>電腦會進攻與防守</small>
          </button>

          <button class="difficulty-btn"
                  data-level="hard">
            🔥 困難
            <small>挑戰最強電腦</small>
          </button>
        </div>

        <button id="start-btn" class="primary-btn">
          開始挑戰 →
        </button>
      </div>
    </section>

    <!-- 猜拳畫面 -->
    <section id="rps-screen" class="screen hidden">
      <div class="card">
        <h2>先來猜拳吧！</h2>
        <p id="rps-message">
          選擇剪刀、石頭或布
        </p>

        <div id="rps-choices" class="rps-choices">
          <button data-hand="rock">
            <span>✊</span>
            石頭
          </button>
          <button data-hand="scissors">
            <span>✌️</span>
            剪刀
          </button>
          <button data-hand="paper">
            <span>✋</span>
            布
          </button>
        </div>

        <div id="rps-result" class="hidden">
          <div class="rps-hands">
            <div class="hand-player">
              <span>你 O</span>
              <strong id="player-hand"></strong>
            </div>
            <div class="hand-ai">
              <span>電腦 X</span>
              <strong id="ai-hand"></strong>
            </div>
          </div>

          <h3 id="rps-outcome"></h3>

          <button id="rps-next-btn" class="primary-btn">
            開始下棋 →
          </button>
        </div>
      </div>
    </section>

    <!-- OOXX 遊戲畫面 -->
    <section id="game-screen" class="screen hidden">

      <div class="scores">
        <div class="score player-score">
          <span>你 O</span>
          <strong id="score-o">0</strong>
        </div>
        <div class="score ai-score">
          <span>電腦 X</span>
          <strong id="score-x">0</strong>
        </div>
      </div>

      <div id="game-status" class="status"
           role="status" aria-live="polite">
        準備開始
      </div>

      <div class="board" aria-label="OOXX 棋盤">
        <button class="cell" data-index="0" aria-label="第1格"></button>
        <button class="cell" data-index="1" aria-label="第2格"></button>
        <button class="cell" data-index="2" aria-label="第3格"></button>
        <button class="cell" data-index="3" aria-label="第4格"></button>
        <button class="cell" data-index="4" aria-label="第5格"></button>
        <button class="cell" data-index="5" aria-label="第6格"></button>
        <button class="cell" data-index="6" aria-label="第7格"></button>
        <button class="cell" data-index="7" aria-label="第8格"></button>
        <button class="cell" data-index="8" aria-label="第9格"></button>
      </div>

      <button id="restart-btn" class="primary-btn">
        再玩一局 ↻
      </button>

      <button id="change-level-btn" class="secondary-btn">
        更換難度
      </button>

      <button id="reset-btn" class="text-btn">
        重置比分
      </button>

    </section>

    <footer>OOXX ♡ Have fun!</footer>

  </main>

</body>
</html>
